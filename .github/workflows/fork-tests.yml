name: Fork regression tests

on:
  push:
    branches:
      - "fix/**"
      - "test/**"
      - "feature/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python source syntax
        run: python -m compileall -q custom_components/engie
      - name: Install isolated test dependency
        run: python -m pip install "httpx>=0.27.0"
      - name: Verify statistics metadata
        run: python -m unittest discover -s tests -v
